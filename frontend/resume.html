<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职小猪 - 简历分析</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="avatar-wrapper">
                    <img src="../职小猪.png" alt="职小猪" class="avatar">
                </div>
                <h2 class="sidebar-title">职小猪</h2>
                <p class="sidebar-subtitle">您的智能职业助手</p>
            </div>

            <nav class="sidebar-features">
                <a href="index.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    <span>智能对话</span>
                </a>
                <a href="resume.html" class="feature-item active">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span>简历分析</span>
                </a>
                <a href="interview.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span>模拟面试</span>
                </a>
                <a href="job-search.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>职位搜索</span>
                </a>
            </nav>

            <div class="sidebar-history" id="sidebar-history">
                <div class="history-header">
                    <span class="history-title">历史对话</span>
                    <button class="history-new-btn" onclick="resetResume()" title="新对话">+</button>
                </div>
                <div class="history-list" id="history-list">
                    <p class="history-empty">暂无历史对话</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="current-user-name">未设置昵称</span>
                </div>
                <button class="user-switch-btn" onclick="changeUser()" title="切换用户">切换</button>
                <p class="footer-text">Powered by 职通车队</p>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <button class="mobile-menu-btn" onclick="toggleMobileDrawer()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="header-info">
                    <h1 class="header-title">简历分析</h1>
                    <p class="header-status">
                        <span class="status-dot"></span>
                        上传简历，获取专业分析建议
                    </p>
                </div>
                <button class="header-action" title="重新开始" onclick="resetResume()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
                    </svg>
                </button>
            </div>

            <div id="chat-box" class="chat-box">
                <!-- 上传区域 -->
                <div id="upload-section" class="upload-section">
                    <div class="upload-card">
                        <div class="upload-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <h3 class="upload-title">上传你的简历</h3>
                        <p class="upload-desc">支持 TXT、DOCX、PDF 格式</p>
                        <label class="upload-btn" for="file-input">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            选择文件
                        </label>
                        <input type="file" id="file-input" accept=".txt,.docx,.pdf" onchange="handleFileSelect(event)" hidden>
                        <p id="file-name" class="file-name"></p>
                        <button id="analyze-btn" class="analyze-btn" onclick="analyzeResume()" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            开始分析
                        </button>
                        <p id="upload-status" class="upload-status"></p>
                    </div>
                </div>

                <!-- 快捷操作 -->
                <div id="resume-actions" class="resume-actions" style="display:none;">
                    <button class="quick-btn" onclick="resumeQuickAsk('请指出我简历中的不足之处')">简历诊断</button>
                    <button class="quick-btn" onclick="resumeQuickAsk('帮我优化简历的措辞和表达')">措辞优化</button>
                    <button class="quick-btn" onclick="resumeQuickAsk('根据我的简历，我应该投递哪些岗位？')">岗位推荐</button>
                    <button class="quick-btn" onclick="resumeQuickAsk('针对我的项目经历，面试官可能会问什么？')">模拟面试</button>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="输入关于简历的问题..." autocomplete="off">
                    <button onclick="sendResumeMessage()" id="send-btn" class="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">按 Enter 发送消息</p>
            </div>
        </main>

        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <a href="index.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    智能对话
                </a>
                <a href="resume.html" class="mobile-nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    简历分析
                </a>
                <a href="interview.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    模拟面试
                </a>
                <a href="job-search.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    职位搜索
                </a>
            </div>
        </nav>
    </div>

        <div class="mobile-drawer-overlay" id="mobile-drawer-overlay" onclick="toggleMobileDrawer()"></div>
        <div class="mobile-drawer" id="mobile-drawer">
            <div class="mobile-drawer-header">
                <span>历史对话</span>
                <button onclick="toggleMobileDrawer()" class="mobile-drawer-close">&times;</button>
            </div>
            <div class="mobile-drawer-history" id="mobile-history-list">
                <p class="history-empty">暂无历史对话</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="resume.js"></script>
</body>
</html>
