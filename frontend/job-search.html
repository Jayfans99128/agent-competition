<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职小猪 - 职位搜索</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="avatar-wrapper">
                    <img src="../职小猪.png" alt="职小猪" class="avatar">
                </div>
                <h2 class="sidebar-title">职小猪</h2>
                <p class="sidebar-subtitle">您的智能职业助手</p>
            </div>

            <nav class="sidebar-features">
                <a href="index.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    <span>智能对话</span>
                </a>
                <a href="resume.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span>简历分析</span>
                </a>
                <a href="interview.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span>模拟面试</span>
                </a>
                <a href="job-search.html" class="feature-item active">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>职位搜索</span>
                </a>
            </nav>

            <div class="sidebar-history" id="sidebar-history">
                <div class="history-header">
                    <span class="history-title">历史对话</span>
                    <button class="history-new-btn" onclick="clearJobChat()" title="新对话">+</button>
                </div>
                <div class="history-list" id="history-list">
                    <p class="history-empty">暂无历史对话</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="current-user-name">未设置昵称</span>
                </div>
                <button class="user-switch-btn" onclick="changeUser()" title="切换用户">切换</button>
                <p class="footer-text">Powered by 职通车队</p>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <button class="mobile-menu-btn" onclick="toggleMobileDrawer()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="header-info">
                    <h1 class="header-title">职位搜索</h1>
                    <p class="header-status">
                        <span class="status-dot"></span>
                        帮你找到最合适的工作机会
                    </p>
                </div>
                <button class="header-action" title="清空对话" onclick="clearJobChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                </button>
            </div>

            <div id="chat-box" class="chat-box">
                <div class="welcome-section">
                    <div class="welcome-avatar">
                        <img src="../职小猪.png" alt="职小猪">
                    </div>
                    <h2 class="welcome-title">职位搜索助手</h2>
                    <p class="welcome-desc">告诉我你的专业、技能和意向，我帮你搜索最匹配的职位</p>
                    <div class="job-links-card">
                        <div class="job-links-title">🔗 常用求职渠道</div>
                        <div class="job-links-grid">
                            <a href="https://www.yingjiesheng.com" target="_blank" class="job-link-item">🎓 应届生求职网</a>
                            <a href="https://www.iguopin.com" target="_blank" class="job-link-item">🏢 国聘网</a>
                            <a href="https://job.ncss.cn" target="_blank" class="job-link-item">🏫 国家大学生就业服务平台</a>
                            <a href="https://www.zhaopin.com" target="_blank" class="job-link-item">💼 智联招聘</a>
                            <a href="https://www.51job.com" target="_blank" class="job-link-item">📋 前程无忧</a>
                            <a href="https://www.zhipin.com" target="_blank" class="job-link-item">💬 BOSS直聘</a>
                            <a href="https://www.nowcoder.com" target="_blank" class="job-link-item">💻 牛客网</a>
                            <a href="https://www.liepin.com" target="_blank" class="job-link-item">🎯 猎聘网</a>
                            <a href="https://www.lagou.com" target="_blank" class="job-link-item">🚀 拉勾网</a>
                            <a href="https://campus.chinahr.com" target="_blank" class="job-link-item">🏆 中华英才网</a>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="jobQuickAsk('帮我在网上搜索应届生Java开发岗位')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            Java 开发
                        </button>
                        <button class="quick-btn" onclick="jobQuickAsk('帮我搜索产品经理实习生岗位')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            产品经理
                        </button>
                        <button class="quick-btn" onclick="jobQuickAsk('帮我搜索数据分析相关的校招岗位')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            数据分析
                        </button>
                        <button class="quick-btn" onclick="jobQuickAsk('帮我在网上搜索AI算法工程师岗位要求')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                            AI 算法
                        </button>
                        <button class="quick-btn" onclick="jobQuickAsk('帮我查一下2026年考研工学国家线和报考人数')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 6 3 6 3s6-1 6-3v-5"/>
                            </svg>
                            考研分数线
                        </button>
                        <button class="quick-btn" onclick="jobQuickAsk('帮我查2026年国考广东省税务局的进面分数线和报考人数')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
                            </svg>
                            国考分数线
                        </button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="user-input" placeholder="描述你想要的岗位，职小猪帮你搜索..." rows="1"></textarea>
                    <button onclick="sendJobMessage()" id="send-btn" class="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">按 Enter 发送，Shift + Enter 换行</p>
            </div>
        </main>

        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <a href="index.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    智能对话
                </a>
                <a href="resume.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    简历分析
                </a>
                <a href="interview.html" class="mobile-nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    模拟面试
                </a>
                <a href="job-search.html" class="mobile-nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    职位搜索
                </a>
            </div>
        </nav>
    </div>

        <div class="mobile-drawer-overlay" id="mobile-drawer-overlay" onclick="toggleMobileDrawer()"></div>
        <div class="mobile-drawer" id="mobile-drawer">
            <div class="mobile-drawer-header">
                <span>历史对话</span>
                <button onclick="toggleMobileDrawer()" class="mobile-drawer-close">&times;</button>
            </div>
            <div class="mobile-drawer-history" id="mobile-history-list">
                <p class="history-empty">暂无历史对话</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="job-search.js"></script>
</body>
</html>
