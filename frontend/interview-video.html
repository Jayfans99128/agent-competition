<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职小猪 - 沉浸式面试</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="avatar-wrapper">
                    <img src="./职小猪.png" alt="职小猪" class="avatar">
                </div>
                <h2 class="sidebar-title">职小猪</h2>
                <p class="sidebar-subtitle">您的智能职业助手</p>
            </div>

            <nav class="sidebar-features">
                <a href="index.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    <span>智能对话</span>
                </a>
                <a href="resume.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span>简历分析</span>
                </a>
                <a href="interview.html" class="feature-item active">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                        <polyline points="22 14 21 4 11 9 1 4 1 20"/>
                    </svg>
                    <span>模拟面试</span>
                </a>
                <a href="job-search.html" class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <span>职位搜索</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span id="current-user-name">未设置昵称</span>
                </div>
                <button class="user-switch-btn" onclick="changeUser()">切换</button>
                <p class="footer-text">Powered by 职通车队</p>
            </div>
        </aside>

        <main class="chat-area video-interview-main">
            <!-- 顶部通话状态栏 -->
            <div class="video-call-header">
                <a href="interview.html" class="back-btn" title="返回模拟面试">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </a>
                <div class="header-info">
                    <h1 class="header-title">沉浸式面试</h1>
                    <p class="header-status">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status-text">选择面试类型开始</span>
                    </p>
                </div>
                <div class="header-actions">
                    <span class="call-timer" id="call-timer" style="display:none;">00:00</span>
                    <button class="header-action" id="btn-voice-settings" title="语音设置" onclick="toggleVoiceSettings()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                        </svg>
                    </button>
                    <button class="header-action" id="btn-mute" title="静音" onclick="toggleMute()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
                        </svg>
                    </button>
                    <button class="header-action hangup-btn" title="结束面试" onclick="endVideoInterview()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                            <line x1="2" y1="2" x2="22" y2="22" transform="rotate(45 12 12)"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 视频通话主区域 -->
            <div id="main-content" class="video-call-body">
                <!-- 面试类型选择（初始状态） -->
                <div class="video-interview-types" id="video-types">
                    <h3 class="video-types-title">选择面试类型开始视频通话</h3>
                    <div class="video-types-grid">
                        <button class="video-type-btn" onclick="startVideoInterview('技术面')">
                            <span class="video-type-icon">💻</span>
                            <span class="video-type-label">技术面试</span>
                        </button>
                        <button class="video-type-btn" onclick="startVideoInterview('HR面')">
                            <span class="video-type-icon">🤝</span>
                            <span class="video-type-label">HR 面试</span>
                        </button>
                        <button class="video-type-btn" onclick="startVideoInterview('群面')">
                            <span class="video-type-icon">👥</span>
                            <span class="video-type-label">群面模拟</span>
                        </button>
                        <button class="video-type-btn" onclick="startVideoInterview('产品面')">
                            <span class="video-type-icon">📱</span>
                            <span class="video-type-label">产品面试</span>
                        </button>
                        <button class="video-type-btn" onclick="startVideoInterview('行为面')">
                            <span class="video-type-icon">🧩</span>
                            <span class="video-type-label">行为面试</span>
                        </button>
                    </div>
                </div>

                <!-- 通话中画面（面试开始后显示） -->
                <div class="video-call-stage" id="video-stage" style="display:none;">
                    <!-- 对方画面（数字人 - 全屏） -->
                    <div class="vc-remote" id="vc-remote">
                        <img src="./生成数字人.png" alt="面试官" class="vc-remote-img" id="remote-img">
                        <!-- 说话光环 -->
                        <div class="vc-speak-ring" id="vc-speak-ring"></div>
                        <!-- 对方名称标签 -->
                        <div class="vc-name-tag">
                            <span class="vc-name-dot speaking-hide" id="vc-name-dot"></span>
                            <span id="vc-name-label">AI 面试官</span>
                        </div>
                        <!-- 字幕覆盖层 -->
                        <div class="vc-subtitle-overlay" id="interviewer-subtitle">
                            <p id="interviewer-text">你好！请先确认你的专业和目标岗位。</p>
                        </div>
                    </div>

                    <!-- 自己的小窗口 (PIP) -->
                    <div class="vc-pip" id="vc-pip">
                        <div class="vc-pip-inner">
                            <video id="pip-webcam" autoplay muted playsinline></video>
                            <div class="vc-pip-placeholder" id="pip-placeholder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                        </div>
                        <span class="vc-pip-label">你</span>
                    </div>

                    <!-- 用户说话字幕（自己的 PIP 旁边） -->
                    <div class="vc-user-subtitle" id="user-subtitle" style="display:none;">
                        <p id="user-text"></p>
                    </div>
                </div>
            </div>

            <!-- 底部通话控制栏 -->
            <div class="video-call-controls">
                <!-- 对话记录面板 -->
                <div class="video-chat-panel" id="video-chat-panel" style="display:none;">
                    <div class="video-chat-header">
                        <span>📝 对话记录</span>
                        <button onclick="toggleChatPanel()">收起</button>
                    </div>
                    <div class="video-chat-messages" id="video-chat-messages"></div>
                </div>

                <div class="vc-control-row">
                    <button class="vc-ctrl-btn" onclick="toggleChatPanel()" title="对话记录">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                        </svg>
                    </button>

                    <button class="vc-ctrl-btn mic-btn" id="btn-mic" onclick="toggleMicrophone()" title="点击或按住空格说话">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>

                    <button class="vc-ctrl-btn" id="btn-text-input" onclick="toggleTextInput()" title="文字输入">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </button>
                </div>

                <!-- 文字输入 -->
                <div class="video-text-input" id="video-text-input-area" style="display:none;">
                    <textarea id="video-text-input" placeholder="输入你的回答..." rows="1"></textarea>
                    <button onclick="sendTextAnswer()" class="send-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- 语音设置面板 -->
        <div class="voice-settings-overlay" id="voice-settings-overlay" onclick="toggleVoiceSettings()"></div>
        <div class="voice-settings-panel" id="voice-settings-panel" style="display:none;">
            <div class="voice-settings-header">
                <span>🔊 AI 面试官语音设置</span>
                <button onclick="toggleVoiceSettings()">&times;</button>
            </div>
            <div class="voice-settings-body">
                <div class="voice-setting-row">
                    <label>声音选择</label>
                    <select id="voice-select" onchange="onVoiceChange()">
                        <option>加载中...</option>
                    </select>
                </div>
                <div class="voice-setting-row">
                    <label>语速：<span id="voice-rate-val">1.0x</span></label>
                    <input type="range" id="voice-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="onRateChange()">
                </div>
                <div class="voice-setting-row">
                    <label>音调：<span id="voice-pitch-val">1.05</span></label>
                    <input type="range" id="voice-pitch" min="0.5" max="1.5" step="0.05" value="1.05" oninput="onPitchChange()">
                </div>
                <button class="voice-preview-btn" onclick="previewVoice()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
                    </svg>
                    试听声音
                </button>
            </div>
        </div>

        <!-- 移动端导航 -->
        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <a href="index.html" class="mobile-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>智能对话</a>
                <a href="resume.html" class="mobile-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>简历分析</a>
                <a href="interview.html" class="mobile-nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><polyline points="22 14 21 4 11 9 1 4 1 20"/></svg>模拟面试</a>
                <a href="job-search.html" class="mobile-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>职位搜索</a>
            </div>
        </nav>
    </div>

    <script src="auth.js"></script>
    <script src="interview-video.js"></script>
</body>
</html>
